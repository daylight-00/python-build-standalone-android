[mypy]
warn_no_return = True
warn_redundant_casts = True
warn_return_any = True
warn_unused_configs = True
warn_unused_ignores = True
warn_unreachable = True

# Named here rather than on each caller's command line. The Justfile recipe and
# the CI job used to repeat the same list, so adding a script meant editing two
# places and the two could disagree about what was checked.
files = pythonbuild,tests,build.py,check.py,ci-matrix.py,validate-distribution.py,check-qualification.py,generate-catalog.py,release-notes.py,qualify.py
