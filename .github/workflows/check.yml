name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: 1

# Nothing: linting reads the tree and reports through the run's own log.
permissions: {}

jobs:
  check:
    name: lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - run: uv sync --group check

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy pythonbuild build.py generate-catalog.py check-qualification.py release-notes.py qualify.py

      # The assembler enforces this too, but failing here takes seconds rather
      # than a full build.
      - name: Validate the license manifest
        run: |
          uv run python -c "
          from pathlib import Path
          from pythonbuild.utils import read_json_object
          root = Path('licenses')
          declared = {c['file'] for c in read_json_object(root / 'components.json')['components'] if c.get('file')}
          shipped = {p.name for p in root.glob('LICENSE.*.txt')}
          assert declared == shipped, f'declared-only={sorted(declared - shipped)} shipped-only={sorted(shipped - declared)}'
          print(f'{len(shipped)} component license texts, manifest agrees')
          "

      # The API level in ci-targets.yaml and the one in the input lock describe
      # the same floor. If they ever disagree, one of them was edited alone.
      - name: Validate the build table and input locks
        run: |
          uv run python -c "
          from pythonbuild.targets import load_builds
          from pythonbuild.utils import read_json_object
          builds = load_builds()
          assert builds, 'ci-targets.yaml declares no builds'
          for name, build in sorted(builds.items()):
              lock = read_json_object(build.input_lock_path())
              print(f'{name}: {build.producer}, API {build.android_api.level}, NDK {build.ndk}')
              assert lock['target']['android_api'] == build.android_api.level, name
              assert lock['target']['triple'] == build.triple, name
              assert lock['target']['build_option'] == build.build_option, name
          "
