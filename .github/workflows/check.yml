name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: 1

# Nothing: linting reads the tree and reports through the run's own log.
permissions: {}

jobs:
  check:
    name: lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - run: uv sync --group check

      # Lint, formatting, types, and the test suite. The tools take their scope
      # from their own configuration, so this job names no paths — the list used
      # to live here and in the Justfile, and the two could disagree.
      #
      # The license manifest and the build table were checked by Python embedded
      # in this file, where nothing linted it and nobody could run it without
      # pushing. Both are tests now.
      - run: uv run ./check.py
