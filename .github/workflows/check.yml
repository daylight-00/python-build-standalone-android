name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: 1

# Nothing: linting reads the tree and reports through the run's own log.
permissions: {}

jobs:
  check:
    name: lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - run: uv sync --group check

      # Lint, formatting, types, and the test suite. The tools take their scope
      # from their own configuration, so this job names no paths — the list used
      # to live here and in the Justfile, and the two could disagree.
      #
      # The license manifest and the build table were checked by Python embedded
      # in this file, where nothing linted it and nobody could run it without
      # pushing. Both are tests now.
      - run: uv run ./check.py

  minimum-python:
    name: tests on the minimum supported Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      # pyproject declares a floor of 3.11, matching upstream. A floor nothing
      # ever runs on is a claim with no evidence behind it.
      - run: >-
          uv run --python 3.11 --no-project
          --with pyyaml --with zstandard --with pkgconf
          python -m unittest discover -s tests -t .
