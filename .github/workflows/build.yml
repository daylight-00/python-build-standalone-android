name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: 1

# Nothing: this workflow builds and uploads run artifacts, and writes nothing.
permissions: {}

jobs:
  # Read out of ci-targets.yaml rather than written here. Two workflows each
  # carrying their own copy of the build list is one copy too many.
  matrix:
    name: resolve the build matrix
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.resolve.outputs.builds }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - run: uv sync

      # Assigned to a variable first: `echo "x=$(cmd)"` reports echo's exit
      # status, so a failing cmd would leave an empty output and a green step.
      - id: resolve
        run: |
          builds=$(uv run ./ci-matrix.py)
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "$builds"

  build:
    name: ${{ matrix.build }}
    needs: matrix
    runs-on: ubuntu-latest
    # The source build compiles CPython and six dependencies twice, once to
    # build and once to prove the result is reproducible.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.builds) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - run: uv sync

      # Assigned to a variable first: `echo "x=$(cmd)"` reports echo's exit
      # status, so a failing cmd would leave an empty output and a green step.
      - name: Resolve the release tag and the pinned NDK
        id: pins
        run: |
          ndk=$(jq -er '.ndk.revision' config/toolchain.lock.json)
          echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "ndk=$ndk" >> "$GITHUB_OUTPUT"

      - name: Install the pinned NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ steps.pins.outputs.ndk }}"

      # The source build's workspace reaches a couple of gigabytes and is
      # rebuilt from scratch each run anyway; only the pinned inputs are cached.
      - name: Cache pinned downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: downloads
          key: downloads-${{ hashFiles('config/**/*.json') }}

      - name: Build
        run: uv run ./build.py --target ${{ matrix.build }} --tag ${{ steps.pins.outputs.tag }}

      # The archives must not depend on where, when, or under what umask they
      # were built. The second build deliberately uses a different umask:
      # repeating a build under identical conditions would not have caught the
      # directory and record modes leaking in from the caller.
      - name: Verify reproducibility
        run: |
          (
            umask 002
            uv run ./build.py --target ${{ matrix.build }} \
              --tag ${{ steps.pins.outputs.tag }} --output-dir dist-second-build
          )
          diff dist/*.SHA256SUMS dist-second-build/*.SHA256SUMS
          echo "byte identical across runs and umasks"

      - name: Generate the uv catalog
        run: |
          uv run ./generate-catalog.py --target ${{ matrix.build }} \
            --tag ${{ steps.pins.outputs.tag }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.zst
            dist/*.tar.gz
            dist/*.json
            dist/*.SHA256SUMS
