name: release

# Releases are manual and gated, as upstream's are. Nothing here runs on a push.
#
# `dry-run` defaults to true: this project has never published, and a release is
# the one action in the repository that cannot be taken back.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag (e.g. 20260727)."
        type: string
        required: true
      sha:
        description: "Full SHA of the commit to release."
        type: string
        required: true
      dry-run:
        description: "Build, gate, and assemble everything without publishing."
        type: boolean
        default: true

env:
  FORCE_COLOR: 1

# Two releases of one tag must never race: the second would find assets already
# uploaded and a catalog pointing at a half-finished release. Never cancelled
# mid-flight, because a release interrupted between upload and publish is worse
# than one that waits.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

# Nothing by default. The jobs that write name what they write and why.
permissions: {}

jobs:
  gate:
    name: release gate
    runs-on: ubuntu-latest
    environment: release
    steps:
      - env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: echo "Release of $SHA as $TAG approved"

  # Read out of ci-targets.yaml, at the commit being released rather than at the
  # tip of main: the release must build what that commit declares.
  matrix:
    name: resolve the build matrix
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.resolve.outputs.builds }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      # No project sync: the script declares its dependency inline, so answering
      # one question does not cost an environment build.
      #
      # Assigned to a variable first: `echo "x=$(cmd)"` reports echo's exit
      # status, so a failing cmd would leave an empty output and a green step.
      - id: resolve
        run: |
          builds=$(uv run --script ./ci-matrix.py)
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "$builds"

  build:
    name: build ${{ matrix.build }}
    needs: matrix
    runs-on: ubuntu-latest
    # The source build compiles CPython and six dependencies twice, once to
    # build and once to prove the result is reproducible.
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.matrix.outputs.builds) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - run: uv sync

      # Assigned to a variable first: `echo "x=$(cmd)"` reports echo's exit
      # status, so a failing cmd would leave an empty output and a green step.
      - name: Resolve the pinned NDK
        id: pins
        run: |
          ndk=$(jq -er '.ndk.revision' config/toolchain.lock.json)
          echo "ndk=$ndk" >> "$GITHUB_OUTPUT"

      - name: Install the pinned NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ steps.pins.outputs.ndk }}"

      # The source build's workspace reaches a couple of gigabytes and is
      # rebuilt from scratch each run anyway; only the pinned inputs are cached.
      - name: Cache pinned downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: downloads
          key: downloads-${{ hashFiles('config/**/*.json') }}

      - name: Build
        env:
          TAG: ${{ inputs.tag }}
        run: uv run ./build.py --target ${{ matrix.build }} --tag "$TAG"

      # The guards inside the build have already run; this asks the same
      # questions of the bytes that would be published, which is the only form a
      # consumer ever sees.
      - name: Validate the archives
        run: uv run ./validate-distribution.py dist/*.tar.zst dist/*.tar.gz

      # The second build deliberately uses a different umask: repeating a build
      # under identical conditions would not have caught the directory and
      # record modes leaking in from the caller.
      - name: Verify reproducibility
        env:
          TAG: ${{ inputs.tag }}
        run: |
          (
            umask 002
            uv run ./build.py --target ${{ matrix.build }} \
              --tag "$TAG" --output-dir dist-second-build
          )
          diff dist/*.SHA256SUMS dist-second-build/*.SHA256SUMS

      # CI has no Android runner, so the one check that matters most is produced
      # on a device and committed. It has to cover these exact bytes.
      - name: Device qualification gate
        env:
          TAG: ${{ inputs.tag }}
        run: uv run ./check-qualification.py --target ${{ matrix.build }} --tag "$TAG"

      - name: Generate the uv catalog
        env:
          TAG: ${{ inputs.tag }}
        run: uv run ./generate-catalog.py --target ${{ matrix.build }} --tag "$TAG"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.zst
            dist/*.tar.gz
            dist/*.json
            dist/*.SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # The release itself, and the latest-release branch machines resolve from.
      contents: write
      # Signing the provenance attestation for every published archive.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: true

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: incoming

      - name: Collect the release assets
        run: |
          mkdir -p dist
          find incoming -name '*.tar.zst' -o -name '*.tar.gz' | xargs -I{} cp {} dist/
          find incoming -name 'download-metadata*.json' -o -name 'latest-release.json' \
            | xargs -I{} cp {} dist/
          cd dist && sha256sum *.tar.zst *.tar.gz | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Render the release notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          uv sync
          uv run ./release-notes.py --tag "$TAG" --dist-dir incoming \
            -o dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Generate attestations
        if: ${{ !inputs.dry-run }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.zst
            dist/*.tar.gz

      - name: Create the release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          gh release create "$TAG" \
            --target "$SHA" \
            --title "$TAG" \
            --draft \
            --notes-file dist/RELEASE_NOTES.md
          gh release upload "$TAG" dist/*.tar.zst dist/*.tar.gz \
            dist/SHA256SUMS dist/download-metadata*.json

      # Only once every asset is uploaded, so the catalogs never point at a
      # release that has nothing in it.
      - name: Publish the release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false

      - name: Update the latest-release branch
        if: ${{ !inputs.dry-run }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin latest-release || true
          if git rev-parse --verify origin/latest-release >/dev/null 2>&1; then
            git switch latest-release
          else
            git switch --orphan latest-release
          fi
          # The branch carries the catalogs and nothing else. Machines fetch from
          # it by raw URL, and `git add -A -- '*.json'` matched at every depth, so
          # each release also published its own build receipts here.
          git rm -rq --cached . 2>/dev/null || true
          find . -maxdepth 1 -name '*.json' -delete
          cp dist/download-metadata*.json dist/latest-release.json .
          git add -- ./download-metadata*.json ./latest-release.json
          git commit -m "chore: publish $TAG catalogs"
          git push origin latest-release

      - name: Dry run summary
        if: ${{ inputs.dry-run }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "Dry run: everything below would have been published as $TAG."
          ls -la dist
