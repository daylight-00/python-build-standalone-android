# The line length is upstream's: it sets none, so it is ruff's default there, and
# a file formatted at 100 columns would be rewritten the moment it met upstream's
# formatter. The target is the floor `requires-python` declares, which is upstream's
# too. The lint selection below is a superset of upstream's ["F", "I", "B"];
# a stricter selection costs nothing on the way in.
target-version = "py311"
line-length = 88
# Named rather than inherited from .gitignore: what gets linted should not
# change because an ignore rule did.
extend-exclude = ["build", "dist", "dist-*", "downloads", "work"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The formatter already wraps everything it can at the line length above. What
# E501 is left to report is prose in a comment or a string it cannot split, and
# rewording an explanation to fit a column is not an improvement. Upstream does
# not select E at all and has lines past 170.
ignore = ["E501"]
